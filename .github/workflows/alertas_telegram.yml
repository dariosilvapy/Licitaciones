name: Alertas Telegram y Email

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (minutos 7 y 37, evita el minuto 0). Más frecuencia = más chances de que GitHub dispare alguno a tiempo
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas se pisen si GitHub dispara varias juntas tras un atraso
concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Chequear novedades y notificar
        env:
          DNCP_CONSUMER_KEY: ${{ secrets.DNCP_CONSUMER_KEY }}
          DNCP_CONSUMER_SECRET: ${{ secrets.DNCP_CONSUMER_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notificar_telegram.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos/ data/indice.json
          git diff --quiet --cached || git commit -m "Chequeo de novedades - $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -X theirs || true
          git push
