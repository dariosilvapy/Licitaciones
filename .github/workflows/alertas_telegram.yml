name: Alertas Telegram

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas, en punto (hora UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  alertar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Chequear novedades y notificar
        env:
          DNCP_CONSUMER_KEY: ${{ secrets.DNCP_CONSUMER_KEY }}
          DNCP_CONSUMER_SECRET: ${{ secrets.DNCP_CONSUMER_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notificar_telegram.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos.json
          git diff --quiet --cached || git commit -m "Chequeo de novedades - $(date -u +%Y-%m-%dT%H:%M)"
          git push
