name: Backfill por rango de fechas

on:
  workflow_dispatch:
    inputs:
      fecha_desde:
        description: "Fecha desde (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
      fecha_hasta:
        description: "Fecha hasta (YYYY-MM-DD)"
        required: true
        default: "2025-12-31"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar backfill
        env:
          DNCP_CONSUMER_KEY: ${{ secrets.DNCP_CONSUMER_KEY }}
          DNCP_CONSUMER_SECRET: ${{ secrets.DNCP_CONSUMER_SECRET }}
          FECHA_DESDE: ${{ inputs.fecha_desde }}
          FECHA_HASTA: ${{ inputs.fecha_hasta }}
        run: python scripts/backfill_periodo.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos.json
          git diff --quiet --cached || git commit -m "Backfill por rango de fechas ${{ inputs.fecha_desde }} a ${{ inputs.fecha_hasta }}"
          git push
