name: Importar historico

on:
  workflow_dispatch: {}   # se dispara a mano desde la pestana "Actions"

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar importacion
        run: python scripts/importar_historico_csv.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos.json
          git diff --quiet --cached || git commit -m "Importar historico CSV - $(date -u +%Y-%m-%d)"
          git push
