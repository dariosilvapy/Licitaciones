name: Migrar a esquema particionado (uso unico)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Migrar datos
        run: python scripts/migrar_particionado.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos/ data/indice.json data/procesos.json
          git diff --quiet --cached || git commit -m "Migrar a esquema particionado por anio"
          git push
