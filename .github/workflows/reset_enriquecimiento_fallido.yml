name: Reset enriquecimiento fallido (uso unico)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revertir registros mal marcados
        run: python scripts/reset_enriquecimiento_fallido.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/procesos/ data/indice.json
          git diff --quiet --cached || git commit -m "Reset enriquecimiento fallido (bug de montos)"
          git push
